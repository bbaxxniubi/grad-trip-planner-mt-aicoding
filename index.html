<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>毕业旅行拼团规划</title>
<style>
  :root {
    --bg: #f6f4ef; --card: #ffffff; --ink: #1e1e1e;
    --muted: #6b6b6b; --line: #e4e0d8;
    --accent: #2f6b4f; --accent-soft: #e7f0ea;
    --warn: #b05a2a; --radius: 14px;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
    line-height: 1.6; padding: 24px 16px 80px;
  }
  .wrap { max-width: 820px; margin: 0 auto; }
  .hero { margin-bottom: 28px; }
  .hero h1 { font-size: 26px; margin: 0 0 6px; letter-spacing: -0.5px; }
  .hero p { color: var(--muted); margin: 0; font-size: 14px; }
  .card {
    background: var(--card); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 20px; margin-bottom: 16px;
  }
  .card h2 { font-size: 15px; margin: 0 0 14px; letter-spacing: 0.2px; }
  .card h2 .tag {
    font-size: 11px; font-weight: 400; color: var(--muted);
    background: var(--bg); border-radius: 20px; padding: 2px 8px; margin-left: 6px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 4px; }
  input, textarea, select {
    width: 100%; padding: 10px 12px; border: 1px solid var(--line);
    border-radius: 10px; font-size: 14px; background: #fdfcfa; outline: none;
    font-family: inherit;
  }
  input:focus, textarea:focus, select:focus { border-color: var(--accent); }
  .row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .row-3 { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
  button {
    cursor: pointer; border: none; border-radius: 10px; font-size: 14px;
    padding: 10px 18px; font-family: inherit; font-weight: 500;
  }
  .btn-primary { background: var(--accent); color: #fff; }
  .btn-primary:hover { opacity: 0.9; }
  .btn-ghost { background: var(--bg); color: var(--ink); border: 1px solid var(--line); }
  .btn-ghost:hover { background: #ece9e2; }
  .btn-sm { padding: 6px 12px; font-size: 12px; }
  .btn-danger-soft { background: #fbece5; color: var(--warn); }
  .hidden { display: none !important; }
  .muted { color: var(--muted); font-size: 13px; }
  .share-box {
    display: flex; gap: 8px; align-items: center; margin-top: 12px;
    background: var(--accent-soft); border-radius: 10px; padding: 10px 12px;
  }
  .share-box code {
    flex: 1; font-size: 12px; color: var(--accent); word-break: break-all;
    background: transparent;
  }
  .pill-row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 8px; }
  .pill {
    font-size: 12px; padding: 5px 12px; border-radius: 20px;
    border: 1px solid var(--line); background: var(--bg); cursor: pointer;
  }
  .pill.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .vote-row {
    display: flex; align-items: center; justify-content: space-between;
    padding: 10px 0; border-bottom: 1px solid var(--line); gap: 12px;
  }
  .vote-row:last-child { border-bottom: none; }
  .vote-name { font-size: 14px; font-weight: 500; flex: 1; }
  .vote-btns { display: flex; gap: 6px; }
  .vote-btns button { padding: 4px 10px; font-size: 12px; border-radius: 16px; }
  .vote-btns button.active { background: var(--accent); color: #fff; border-color: var(--accent); }
  .vote-bar {
    height: 6px; background: var(--bg); border-radius: 3px; margin-top: 6px; overflow: hidden;
  }
  .vote-bar span { display: block; height: 100%; background: var(--accent); border-radius: 3px; }
  table { width: 100%; border-collapse: collapse; font-size: 13px; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--line); }
  th { color: var(--muted); font-weight: 500; font-size: 12px; }
  .settle {
    background: var(--bg); border-radius: 10px; padding: 14px;
    margin-top: 14px; font-size: 13px; white-space: pre-wrap; line-height: 1.8;
  }
  .task-item {
    display: flex; align-items: center; justify-content: space-between;
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 14px;
  }
  .task-item:last-child { border-bottom: none; }
  .task-owner { font-size: 12px; color: var(--accent); }
  .itin-entry {
    padding: 8px 0; border-bottom: 1px solid var(--line); font-size: 13px;
  }
  .itin-entry .meta { color: var(--muted); font-size: 11px; margin-top: 2px; }
  .toast {
    position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
    background: #1e1e1e; color: #fff; font-size: 13px; padding: 8px 16px;
    border-radius: 20px; opacity: 0; pointer-events: none; transition: opacity .2s;
  }
  .toast.show { opacity: 1; }
  @media (max-width: 560px) {
    .row, .row-3 { grid-template-columns: 1fr; }
    .vote-row { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>毕业旅行拼团规划</h1>
    <p>发到群里的那一刻，拼团就已经开始了 · 零注册 · 链接即拼团</p>
  </div>

  <!-- 创建区 -->
  <div id="setupCard" class="card">
    <h2>创建拼团 <span class="tag">组织者 30 秒完成</span></h2>
    <div class="row">
      <div><label>拼团名称</label><input id="tripName" placeholder="例：2026 毕业川西线"></div>
      <div><label>你的昵称</label><input id="creatorName" placeholder="例：阿柯"></div>
    </div>
    <div style="margin-top:12px"><label>目的地候选（逗号分隔）</label><input id="destInput" placeholder="例：川西环线, 云南大理, 青岛"></div>
    <div class="row" style="margin-top:12px">
      <div><label>人均预算（元）</label><input id="budgetInput" type="number" placeholder="例：2800"></div>
      <div><label>出发时间候选（逗号分隔）</label><input id="dateInput" placeholder="例：6.15-6.20, 6.22-6.27"></div>
    </div>
    <div style="margin-top:16px"><button class="btn-primary" onclick="createTrip()">创建拼团，生成分享链接</button></div>
  </div>

  <!-- 工作台 -->
  <div id="workspace" class="hidden">
    <div class="card">
      <h2 id="tripTitle"></h2>
      <div class="share-box">
        <code id="shareLink"></code>
        <button class="btn-ghost btn-sm" onclick="copyLink()">复制</button>
      </div>
      <div class="pill-row" id="memberPills"></div>
    </div>

    <div class="card">
      <h2>目的地投票 <span class="tag">三档表态</span></h2>
      <div id="destVoteList"></div>
    </div>

    <div class="card">
      <h2>日期投票 <span class="tag">看谁真的能来</span></h2>
      <div id="dateVoteList"></div>
    </div>

    <div class="card">
      <h2>共享预算 <span class="tag">只记大额共同支出</span></h2>
      <div class="row-3">
        <div><label>支出名称</label><input id="expName" placeholder="成都东站包车"></div>
        <div><label>金额</label><input id="expAmount" type="number" placeholder="480"></div>
        <div><label>付款人</label><select id="expPayer"></select></div>
      </div>
      <div style="margin-top:10px"><label>参与分摊的人（默认全员）</label><div id="splitChecks" class="pill-row"></div></div>
      <div style="margin-top:12px"><button class="btn-primary btn-sm" onclick="addExpense()">记一笔</button></div>
      <div id="expenseList" style="margin-top:14px"></div>
      <div id="settleBox" class="settle hidden"></div>
    </div>

    <div class="card">
      <h2>任务认领墙 <span class="tag">不让一个人扛所有事</span></h2>
      <div id="taskList"></div>
      <div style="margin-top:10px; display:flex; gap:8px;">
        <input id="newTask" placeholder="添加任务，例：订住宿" style="flex:1">
        <button class="btn-ghost btn-sm" onclick="addTask()">添加</button>
      </div>
    </div>

    <div class="card">
      <h2>行程草稿 <span class="tag">想法先落下来</span></h2>
      <div id="itinList"></div>
      <div style="margin-top:10px; display:flex; gap:8px;">
        <input id="newItin" placeholder="例：Day1 下午 宽窄巷子" style="flex:1">
        <button class="btn-ghost btn-sm" onclick="addItin()">添加</button>
      </div>
    </div>

    <div class="card">
      <h2>同步码 <span class="tag">跨设备交换进度</span></h2>
      <p class="muted">本工具为静态部署，数据保存在当前浏览器。把同步码发给另一位成员，对方粘贴后即可看到你的投票和账目状态。</p>
      <div style="display:flex; gap:8px; margin-top:10px;">
        <button class="btn-ghost btn-sm" onclick="exportSync()">生成我的同步码</button>
        <input id="importCode" placeholder="粘贴对方的同步码" style="flex:1">
        <button class="btn-ghost btn-sm" onclick="importSync()">导入</button>
      </div>
      <textarea id="syncOutput" rows="3" readonly placeholder="同步码会出现在这里" style="margin-top:10px; font-size:11px;"></textarea>
    </div>
  </div>
</div>
<div id="toast" class="toast"></div>

<script>
const KEY = 'grad_trip_v1';

function load() {
  try { return JSON.parse(localStorage.getItem(KEY)) || null; } catch { return null; }
}
function save(data) { localStorage.setItem(KEY, JSON.stringify(data)); }
function uid() { return Math.random().toString(36).slice(2, 8); }
function toast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  clearTimeout(window.__tt); window.__tt = setTimeout(() => t.classList.remove('show'), 1800);
}

// ---------- 创建 ----------
function createTrip() {
  const name = document.getElementById('tripName').value.trim();
  const creator = document.getElementById('creatorName').value.trim();
  if (!name || !creator) return toast('请填写拼团名称和昵称');
  const dests = document.getElementById('destInput').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  const dates = document.getElementById('dateInput').value.split(/[,，]/).map(s => s.trim()).filter(Boolean);
  if (!dests.length) return toast('至少填一个目的地');
  const budget = Number(document.getElementById('budgetInput').value) || 0;
  const data = {
    id: uid(), name, creator, budget,
    members: [creator],
    dests: dests.map(d => ({ name: d, votes: {} })),
    dates: dates.map(d => ({ name: d, votes: {} })),
    expenses: [], tasks: [
      { id: uid(), name: '订住宿', owner: '' },
      { id: uid(), name: '查包车', owner: '' },
      { id: uid(), name: '买保险', owner: '' },
      { id: uid(), name: '管账', owner: creator },
    ],
    itins: []
  };
  save(data);
  renderAll();
  document.getElementById('setupCard').classList.add('hidden');
  document.getElementById('workspace').classList.remove('hidden');
  toast('拼团已创建，复制链接发到群里');
}

// ---------- 渲染 ----------
function renderAll() {
  const d = load(); if (!d) return;
  document.getElementById('tripTitle').textContent = d.name + ' · 人均预算 ¥' + (d.budget || '待定');
  document.getElementById('shareLink').textContent = location.href.split('?')[0] + '?trip=' + d.id;

  // 成员
  document.getElementById('memberPills').innerHTML = d.members.map(m =>
    `<span class="pill active">${esc(m)}</span>`).join('');

  // 目的地投票
  document.getElementById('destVoteList').innerHTML = d.dests.map((dest, i) => {
    const counts = countVotes(dest.votes);
    const total = Object.keys(dest.votes).length;
    return `<div>
      <div class="vote-row">
        <div class="vote-name">${esc(dest.name)}</div>
        <div class="vote-btns">
          ${voteBtns('dest', i, dest.votes, '想去')}
          ${voteBtns('dest', i, dest.votes, '可以')}
          ${voteBtns('dest', i, dest.votes, '不去')}
        </div>
      </div>
      ${voteBar(counts, total)}
    </div>`;
  }).join('') || '<p class="muted">暂无目的地</p>';

  // 日期投票
  document.getElementById('dateVoteList').innerHTML = d.dates.map((dt, i) => {
    const counts = countVotes(dt.votes);
    const total = Object.keys(dt.votes).length;
    return `<div>
      <div class="vote-row">
        <div class="vote-name">${esc(dt.name)}</div>
        <div class="vote-btns">
          ${voteBtns('date', i, dt.votes, '可以')}
          ${voteBtns('date', i, dt.votes, '紧张')}
          ${voteBtns('date', i, dt.votes, '不行')}
        </div>
      </div>
      ${voteBar(counts, total)}
    </div>`;
  }).join('') || '<p class="muted">暂无日期候选</p>';

  // 付款人下拉
  const payerSel = document.getElementById('expPayer');
  payerSel.innerHTML = d.members.map(m => `<option>${esc(m)}</option>`).join('');
  // 分摊勾选
  document.getElementById('splitChecks').innerHTML = d.members.map(m =>
    `<label style="display:inline-flex; align-items:center; gap:4px; font-size:13px; color:var(--ink); margin-right:10px;">
      <input type="checkbox" class="split-cb" value="${esc(m)}" checked style="width:auto;"> ${esc(m)}
    </label>`).join('');

  // 支出列表
  document.getElementById('expenseList').innerHTML = d.expenses.length ?
    `<table><thead><tr><th>项目</th><th>金额</th><th>付款人</th><th>分摊人</th><th></th></tr></thead><tbody>
    ${d.expenses.map(e => `<tr>
      <td>${esc(e.name)}</td><td>¥${e.amount}</td><td>${esc(e.payer)}</td>
      <td>${e.split.join('、')}</td>
      <td><button class="btn-danger-soft btn-sm" onclick="removeExpense('${e.id}')">删除</button></td>
    </tr>`).join('')}
    </tbody></table>` : '<p class="muted">还没有共同支出。只记住宿、包车、门票、集体餐这类大额项目。</p>';

  renderSettle(d);

  // 任务
  document.getElementById('taskList').innerHTML = d.tasks.map(t =>
    `<div class="task-item">
      <span>${esc(t.name)} ${t.owner ? `<span class="task-owner">→ ${esc(t.owner)}</span>` : '<span class="muted">· 待认领</span>'}</span>
      ${t.owner ? `<span class="muted" style="font-size:11px;">已认领</span>` : `<button class="btn-ghost btn-sm" onclick="claimTask('${t.id}')">我来</button>`}
    </div>`).join('');

  // 行程草稿
  document.getElementById('itinList').innerHTML = d.itins.length ?
    d.itins.slice().reverse().map(it =>
      `<div class="itin-entry">${esc(it.text)}<div class="meta">${esc(it.by)} · ${it.time}</div></div>`
    ).join('') : '<p class="muted">还没有内容。每个人都可以往里面丢想法。</p>';
}

function voteBtns(type, idx, votes, label) {
  const me = getMe();
  const active = votes[me] === label ? 'active' : '';
  return `<button class="btn-ghost ${active}" onclick="castVote('${type}',${idx},'${label}')">${label}</button>`;
}
function countVotes(votes) {
  const c = {};
  Object.values(votes).forEach(v => { c[v] = (c[v] || 0) + 1; });
  return c;
}
function voteBar(counts, total) {
  if (!total) return '';
  const yes = (counts['想去'] || 0) + (counts['可以'] || 0);
  const pct = Math.round(yes / total * 100);
  return `<div class="vote-bar"><span style="width:${pct}%"></span></div>`;
}

// ---------- 投票 ----------
function castVote(type, idx, label) {
  const d = load(); const me = getMe();
  const arr = type === 'dest' ? d.dests : d.dates;
  arr[idx].votes[me] = label;
  save(d); renderAll();
}

// ---------- 支出 ----------
function addExpense() {
  const d = load();
  const name = document.getElementById('expName').value.trim();
  const amount = Number(document.getElementById('expAmount').value);
  const payer = document.getElementById('expPayer').value;
  const split = [...document.querySelectorAll('.split-cb:checked')].map(cb => cb.value);
  if (!name || !amount) return toast('请填写支出名称和金额');
  if (!split.length) return toast('至少勾选一个分摊人');
  d.expenses.push({ id: uid(), name, amount, payer, split });
  save(d); renderAll();
  document.getElementById('expName').value = '';
  document.getElementById('expAmount').value = '';
  toast('已记一笔');
}
function removeExpense(id) {
  const d = load();
  d.expenses = d.expenses.filter(e => e.id !== id);
  save(d); renderAll();
}

function renderSettle(d) {
  const box = document.getElementById('settleBox');
  if (!d.expenses.length) { box.classList.add('hidden'); return; }
  const balance = {};
  d.members.forEach(m => balance[m] = 0);
  d.expenses.forEach(e => {
    const share = e.amount / e.split.length;
    balance[e.payer] = (balance[e.payer] || 0) + e.amount;
    e.split.forEach(m => balance[m] = (balance[m] || 0) - share);
  });
  const debtors = [], creditors = [];
  Object.entries(balance).forEach(([m, v]) => {
    if (v < -0.01) debtors.push({ m, v: -v });
    if (v > 0.01) creditors.push({ m, v });
  });
  debtors.sort((a, b) => b.v - a.v);
  creditors.sort((a, b) => b.v - a.v);
  const transfers = [];
  let i = 0, j = 0;
  while (i < debtors.length && j < creditors.length) {
    const amt = Math.min(debtors[i].v, creditors[j].v);
    if (amt > 0.01) transfers.push(`${debtors[i].m} → ${creditors[j].m}：¥${amt.toFixed(0)}`);
    debtors[i].v -= amt; creditors[j].v -= amt;
    if (debtors[i].v < 0.01) i++;
    if (creditors[j].v < 0.01) j++;
  }
  box.classList.remove('hidden');
  box.textContent = '结算建议（最少转账笔数）：\n' + (transfers.length ? transfers.join('\n') : '已平账，无需转账') +
    '\n\n总共同支出：¥' + d.expenses.reduce((s, e) => s + e.amount, 0);
}

// ---------- 任务 ----------
function claimTask(id) {
  const d = load(); const me = getMe();
  const t = d.tasks.find(t => t.id === id);
  if (t && !t.owner) { t.owner = me; save(d); renderAll(); toast('已认领，责任明确了'); }
}
function addTask() {
  const d = load();
  const name = document.getElementById('newTask').value.trim();
  if (!name) return;
  d.tasks.push({ id: uid(), name, owner: '' });
  save(d); renderAll();
  document.getElementById('newTask').value = '';
}

// ---------- 行程草稿 ----------
function addItin() {
  const d = load(); const me = getMe();
  const text = document.getElementById('newItin').value.trim();
  if (!text) return;
  d.itins.push({ text, by: me, time: new Date().toLocaleString('zh-CN', { month: 'numeric', day: 'numeric', hour: '2-digit', minute: '2-digit' }) });
  save(d); renderAll();
  document.getElementById('newItin').value = '';
}

// ---------- 同步 ----------
function exportSync() {
  const d = load();
  document.getElementById('syncOutput').value = btoa(unescape(encodeURIComponent(JSON.stringify(d))));
  toast('同步码已生成，发给另一位成员');
}
function importSync() {
  const raw = document.getElementById('importCode').value.trim();
  if (!raw) return toast('请粘贴同步码');
  try {
    const incoming = JSON.parse(decodeURIComponent(escape(atob(raw))));
    const local = load();
    if (!local) { save(incoming); renderAll(); return toast('已导入拼团数据'); }
    // 合并：以 incoming 的投票和账目覆盖，成员取并集
    local.members = [...new Set([...local.members, ...incoming.members])];
    local.dests.forEach((dest, i) => {
      if (incoming.dests[i]) Object.assign(dest.votes, incoming.dests[i].votes);
    });
    local.dates.forEach((dt, i) => {
      if (incoming.dates[i]) Object.assign(dt.votes, incoming.dates[i].votes);
    });
    const existIds = new Set(local.expenses.map(e => e.id));
    incoming.expenses.forEach(e => { if (!existIds.has(e.id)) local.expenses.push(e); });
    const existTaskIds = new Set(local.tasks.map(t => t.id));
    incoming.tasks.forEach(t => {
      if (!existTaskIds.has(t.id)) local.tasks.push(t);
      else { const lt = local.tasks.find(x => x.id === t.id); if (t.owner && !lt.owner) lt.owner = t.owner; }
    });
    const existItin = new Set(local.itins.map(i => i.text + i.by));
    incoming.itins.forEach(it => { if (!existItin.has(it.text + it.by)) local.itins.push(it); });
    save(local); renderAll(); toast('同步完成');
  } catch { toast('同步码格式不正确'); }
}

// ---------- 工具 ----------
function getMe() {
  const d = load();
  return d ? d.creator : '我';
}
function esc(s) { return String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function copyLink() {
  const text = document.getElementById('shareLink').textContent;
  navigator.clipboard?.writeText(text).then(() => toast('链接已复制，发到群里吧'));
}

// ---------- 入口 ----------
(function init() {
  const d = load();
  if (d) {
    document.getElementById('setupCard').classList.add('hidden');
    document.getElementById('workspace').classList.remove('hidden');
    renderAll();
  }
})();
</script>
</body>
</html>
